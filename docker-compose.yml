services:
  nav2_sim:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sleep", "infinity"]
    tty: true
    stdin_open: true
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: xcb
      GAZEBO_MODEL_DATABASE_URI: ""
    volumes:
      - .:/repo:ro
      - build_nav2:/ws/build
      - install_nav2:/ws/install
      - log_nav2:/ws/log
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
volumes:
  build_nav2:
  install_nav2:
  log_nav2:
